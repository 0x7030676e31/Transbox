[workspace]
members = ["crates/transbox-core", "crates/transbox-relay", "crates/transbox-storage", "crates/transbox"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.2"
edition = "2024"
license = "MIT"
rust-version = "1.100"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
transbox-core = { path = "crates/transbox-core" }
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs", "zeroize"] }
getrandom = "0.4"
zeroize = "1.9"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
