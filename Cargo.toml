[workspace]
members = ["crates/transbox-core", "crates/transbox-relay", "crates/transbox"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
transbox-core = { path = "crates/transbox-core" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
